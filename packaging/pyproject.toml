[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rctf-monitor"
version = "0.1.1"
description = "Profile-driven rCTF challenge monitor and attachment downloader"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Kredsya"}]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
rctf-monitor = "rctf_monitor.app:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
